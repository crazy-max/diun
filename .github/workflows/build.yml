name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:

env:
  DOCKERHUB_SLUG: crazymax/diun
  GHCR_SLUG: ghcr.io/crazy-max/diun
  DESTDIR: ./bin
  DOCKER_BUILD_SUMMARY: false
  SCOUT_VERSION: "1.19.0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      validate-includes: ${{ steps.validate.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest
      -
        name: Validate matrix
        id: validate
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          target: validate
          fields: platforms
        env:
          GOLANGCI_LINT_MULTIPLATFORM: 1

  validate:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.validate-includes) }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Validate
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platforms }}

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read # same as global permissions
      id-token: write # for Codecov authentication
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Test
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: test
          pull: true
      -
        name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ${{ env.DESTDIR }}/coverage
          use_oidc: true
          disable_file_fixes: true # needed for Go language https://docs.codecov.com/docs/fixing-reports

  test-integration:
    name: test-integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # same as global permissions
      id-token: write # for Codecov authentication
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: docker
            service: docker
            run: '^TestDocker(Provider|Discovery)$'
          - suite: swarm
            service: docker
            run: '^TestSwarmProvider$'
          - suite: dockerfile
            run: '^TestDockerfileProvider$'
          - suite: file
            run: '^TestFileProvider$'
          - suite: containerd
            service: containerd
            run: '^TestContainerdProvider$'
          - suite: nomad
            service: nomad
            run: '^TestNomadProvider$'
          - suite: metrics
            run: '^TestMetrics$'
          - suite: kubernetes
            service: kubernetes
            run: '^TestKubernetesProvider$'
    env:
      TEST_RUN: ${{ matrix.run }}
      TEST_SERVICE: ${{ matrix.service }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Integration tests
        run: |
          if [ -n "$TEST_SERVICE" ]; then
            docker compose -f test/compose.yaml up --build -d --wait "$TEST_SERVICE"
          fi
          docker compose -f test/compose.yaml run --build --rm --no-deps tests
      -
        name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: bin/coverage/integration/coverage.txt
          flags: integration
          name: integration-${{ matrix.suite }}
          use_oidc: true
          disable_file_fixes: true # needed for Go language https://docs.codecov.com/docs/fixing-reports
      -
        name: Logs
        if: always()
        run: docker compose -f test/compose.yaml logs
      -
        name: Cleanup
        if: always()
        run: docker compose -f test/compose.yaml down --volumes --remove-orphans

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read # same as global permission
      security-events: write # required to write sarif report
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Run
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: govulncheck
        env:
          GOVULNCHECK_FORMAT: sarif
      -
        name: Upload SARIF report
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.DESTDIR }}/govulncheck.out

  artifacts:
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read # same as global permission
      id-token: write # for signing attestation(s) with GitHub OIDC Token
    with:
      runner: ubuntu-latest
      target: artifact-all
      output: local
      artifact-name: diun
      artifact-upload: true
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      set: |
        *.args.GIT_FETCH_HISTORY=1

  artifacts-finalize:
    runs-on: ubuntu-latest
    needs:
      - artifacts
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifacts.outputs.artifact-name }}
          path: /tmp/buildx-output
      -
        name: Rename provenance and sbom
        run: |
          for pdir in /tmp/buildx-output/*/; do
            (
              cd "$pdir"
              binname=$(find . -name 'diun_*')
              filename=$(basename "$binname" | sed -E 's/\.(tar\.gz|zip)$//')
              mv "provenance.json" "${filename}.provenance.json"
              mv "sbom-binary.spdx.json" "${filename}.sbom.json"
              find . -name 'sbom*.json' -exec rm {} \;
              if [ -f "provenance.sigstore.json" ]; then
                mv "provenance.sigstore.json" "${filename}.provenance.sigstore.json"
              fi
            )
          done
          mkdir -p "${{ env.DESTDIR }}"
          mv /tmp/buildx-output/**/* "${{ env.DESTDIR }}/"
      -
        name: List artifacts
        working-directory: ${{ env.DESTDIR }}
        run: |
          tree -nh .
      -
        name: Check artifacts
        working-directory: ${{ env.DESTDIR }}
        run: |
          find . -type f -exec file -e ascii -- {} +
      -
        name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ env.DESTDIR }}/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create GitHub release
    needs:
      - artifacts-finalize
      - test-unit
      - test-integration
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ env.DESTDIR }}/artifact
          name: release
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: release
          provenance: false
      -
        name: List artifacts
        working-directory: ${{ env.DESTDIR }}/release
        run: |
          tree -nh .
      -
        name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            ${{ env.DESTDIR }}/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-prepare:
    runs-on: ubuntu-latest
    outputs:
      repo-slugs: |
        ${{ env.DOCKERHUB_SLUG }}
        ${{ env.GHCR_SLUG }}
    steps:
      # FIXME: can't use env object in reusable workflow inputs: https://github.com/orgs/community/discussions/26671
      - run: echo "Exposing env vars for reusable workflow"

  image:
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read # same as global permission
      id-token: write # for signing attestation(s) with GitHub OIDC Token
    needs:
      - image-prepare
      - artifacts-finalize
      - test-unit
      - test-integration
    with:
      runner: ubuntu-latest
      target: image-all
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set-meta-labels: true
      meta-images: |
        ${{ needs.image-prepare.outputs.repo-slugs }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=ref,event=pr
        type=edge
      meta-labels: |
        org.opencontainers.image.title=Diun
        org.opencontainers.image.description=Docker image update notifier
        org.opencontainers.image.vendor=CrazyMax
      set: |
        *.args.GIT_FETCH_HISTORY=1
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

  scout:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read # same as global permission
      security-events: write # required to write sarif report
    needs:
      - image
    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Scout
        id: scout
        uses: crazy-max/.github/.github/actions/docker-scout@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          version: ${{ env.SCOUT_VERSION }}
          format: sarif
          image: registry://${{ env.DOCKERHUB_SLUG }}:${{ needs.image.outputs.digest }}
      -
        name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scout.outputs.result-file }}
